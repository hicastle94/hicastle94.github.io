    function initializeVictim(v, isNew){
        var personalities = [
            {type:'신중형', caution:18, impulse:6, social:7, recovery:4},
            {type:'충동형', caution:5, impulse:18, social:8, recovery:12},
            {type:'사회형', caution:9, impulse:11, social:18, recovery:8},
            {type:'추격형', caution:5, impulse:16, social:5, recovery:20}
        ];
        var p = personalities[Math.floor(Math.random()*personalities.length)];
        if(!v.personality){
            v.personality = p.type;
            v.caution = p.caution;
            v.impulse = p.impulse;
            v.social = p.social;
            v.recovery = p.recovery;
        }
        v.lossStreak = v.lossStreak || 0;
        v.winStreak = v.winStreak || 0;
        v.totalLost = v.totalLost || 0;
        v.totalWon = v.totalWon || 0;
        v.totalWagered = v.totalWagered || 0;
        v.totalPayout = v.totalPayout || 0;
        v.refundedTotal = v.refundedTotal || 0;
        v.events = Array.isArray(v.events) ? v.events : [];
        v.riskLevel = v.riskLevel || 0;
        v.lastRiskLevel = (typeof v.lastRiskLevel === 'number') ? v.lastRiskLevel : 0;
        v.firstWin = !!v.firstWin;
        v.firstLoss = !!v.firstLoss;
        v.firstCharge = !!v.firstCharge;
        v.firstLoan = !!v.firstLoan;
        v.firstFriend = !!v.firstFriend;
        v.milestoneRepeat = !!v.milestoneRepeat;
        v.milestoneLoss = !!v.milestoneLoss;
        v.milestoneMental60 = !!v.milestoneMental60;
        v.milestoneMental35 = !!v.milestoneMental35;
        v.milestoneDebtRepeat = !!v.milestoneDebtRepeat;
        v.lastEventSeason = (typeof v.lastEventSeason === 'number') ? v.lastEventSeason : -99;
        v.lastThoughtText = v.lastThoughtText || '';
        v.thoughtCooldown = v.thoughtCooldown || 0;
        if(isNew && v.thoughts.length === 0){
            v.thoughts.push({text:v.think, season:season});
        }
        updateVictimState(v);
    }

    function valueRotate(min,max,add,now){
        if(now + add < min) return max;
        if(now + add > max) return min;
        return now + add;
    }
    function valueInRange(min,max,add,now){
        if(now + add > max) return max;
        if(now + add < min) return min;
        return now + add;
    }
    function isInRange(min,max,now){
        if(now >= min && now <= max) return true;
        return false;
    }
    function max(a,b){
        if(a>= b) return a;
        else return b;
    }
    function min(a,b){
        if(a>= b) return b;
        else return a;
    }

    function getVictimRiskScore(v){
        var score = 0;
        score += Math.min(35, (v.betCount || 0) * 3);
        score += Math.min(25, (v.lossStreak || 0) * 7);
        score += Math.min(25, (v.loan || 0) > 0 ? 15 + Math.min(10, (v.loan / Math.max(1,v.income)) * 2) : 0);
        score += Math.min(20, Math.max(0, 100 - (v.mental || 100)) * 0.25);
        score += Math.min(15, (v.paycount || 0) * 3);
        return Math.max(0, Math.min(100, Math.round(score)));
    }

    function getRiskLabel(score){
        if(score >= 75) return '심각';
        if(score >= 50) return '위험';
        if(score >= 25) return '주의';
        return '관찰';
    }

    function getNetBetLoss(v){
        return Math.max(0, Math.floor((v.totalWagered || 0) - (v.totalPayout || 0)));
    }

    function addVictimEvent(who, type, text, severity){
        var v = victimList[who];
        if(!v) return;
        initializeVictim(v, false);
        if(!Array.isArray(v.events)) v.events = [];
        var last = v.events.length ? v.events[v.events.length-1] : null;
        if(last && last.type === type && last.text === text && last.season === season) return;
        v.events.push({ season:season, type:type, text:text, severity:severity || 1 });
        if(v.events.length > 30) v.events.shift();
    }

    function updateVictimRiskEvent(i){
        var v = victimList[i];
        var score = getVictimRiskScore(v);
        var level = score >= 75 ? 3 : score >= 50 ? 2 : score >= 25 ? 1 : 0;
        v.riskLevel = level;
        if(level > (v.lastRiskLevel || 0)){
            var label = ['관찰','주의','위험','심각'][level];
            addVictimEvent(i, 'risk', '피해 위험 단계가 '+label+' 수준으로 높아졌다.', level);
            v.lastRiskLevel = level;
        }
    }

    function getSpotlightVictim(){
        if(victimList.length === 0) return null;
        var best = victimList[0], bestScore = -1;
        for(var i=0;i<victimList.length;i++){
            var score = getVictimRiskScore(victimList[i]);
            if(score > bestScore){ bestScore = score; best = victimList[i]; }
        }
        return { victim:best, score:bestScore };
    }

    function updateVictimMilestones(i){
        var v = victimList[i];
        initializeVictim(v, false);

        if(!v.milestoneRepeat && v.betCount >= 3){
            v.milestoneRepeat = true;
            addThought(i, '어느새 여러 번 반복해서 베팅하고 있어.', true);
            addVictimEvent(i, 'repeat', '반복 베팅이 3회 이상 이어졌다.', 1);
        }
        if(!v.milestoneLoss && v.totalLost >= Math.max(30000, v.income * 3)){
            v.milestoneLoss = true;
            addThought(i, '잃은 돈이 생각보다 많이 커졌어.', true);
            addVictimEvent(i, 'loss', '누적 베팅 손실이 소득 대비 큰 수준으로 증가했다.', 2);
        }
        if(!v.milestoneMental60 && v.mental <= 60){
            v.milestoneMental60 = true;
            addThought(i, '계속 결과가 신경 쓰여. 다른 일에 집중하기가 어렵다.', true);
            addVictimEvent(i, 'mental', '정신 상태가 주의 단계까지 낮아졌다.', 2);
        }
        if(!v.milestoneMental35 && v.mental <= 35){
            v.milestoneMental35 = true;
            addThought(i, '잃은 돈 생각 때문에 마음이 너무 조급해.', true);
            addVictimEvent(i, 'mental', '정신 상태가 심각 단계까지 낮아졌다.', 3);
        }
        if(!v.milestoneDebtRepeat && v.loan > 0 && v.paycount >= 2){
            v.milestoneDebtRepeat = true;
            addThought(i, '빚이 있는데도 다시 돈을 넣고 있어.', true);
            addVictimEvent(i, 'debt', '대출이 있는 상태에서 다시 충전했다.', 3);
        }
        updateVictimRiskEvent(i);
    }

    function createStrategyButton(sceneRef, x, y, label, key){
        var bg = sceneRef.add.rectangle(x,y,455,64,0x2a2a2a,0.98).setStrokeStyle(2,0xffffff,0.35).setInteractive({useHandCursor:true}).setDepth(12).setVisible(false);
        var tx = sceneRef.add.text(x,y,label,{fontSize:'30px',color:'#ffffff',fontStyle:'bold',align:'center',fixedWidth:430}).setOrigin(0.5).setDepth(13).setVisible(false);
        bg.on('pointerdown', function(){ applyOperatorChoice(key); });
        bg.on('pointerover', function(){ if(bg.input && bg.input.enabled) bg.setFillStyle(0x444444,1); });
        bg.on('pointerout', function(){ bg.setFillStyle(0x2a2a2a,0.98); });
        ui_strategyButtons.push({key:key,bg:bg,text:tx});
        ui_strategyPanelObjects.push(bg);
        ui_strategyPanelObjects.push(tx);

    function strategyUnlocked(key){
        // 선택창이 열린 순간에 필요한 선택지만 활성화한다.
        // 각 단계에서는 해당 유도 전략과 '보상 중단'을 비교할 수 있다.
        if(!strategyState.pendingChoice) return false;
        if(key === 'stop') return true;
        return key === strategyState.pendingChoice;
    }

    function recordOperatorDecision(key, title, siteEffect, victimEffect){
        if(!Array.isArray(mySite.decisions)) mySite.decisions=[];
        mySite.decisions.push({season:season,key:key,title:title,siteEffect:siteEffect,victimEffect:victimEffect});
        if(mySite.decisions.length>20) mySite.decisions.shift();
    }

    function applyOperatorChoice(key){
        if(scene !== 2 || !gameOn || is_dialog) return;
        if(!strategyUnlocked(key)){
            if(ui_strategyFeedback) ui_strategyFeedback.setText('아직 이 선택이 등장하지 않은 단계입니다.');
            return;
        }
        if(strategyState.lastChoiceSeason === season){
            if(ui_strategyFeedback) ui_strategyFeedback.setText('이번 회차에는 이미 선택했습니다. 다음 회차의 변화를 관찰하세요.');
            return;
        }

        var affected=0;
        var siteEffect='';
        var victimEffect='';
        var title='';

        if(key === 'free'){
            title='무료 포인트 지급';
            var candidates=victimList.slice().sort(function(a,b){ return (a.betCount||0)-(b.betCount||0); });
            for(var i=0;i<Math.min(3,candidates.length);i++){
                var v=candidates[i];
                var idx=victimList.indexOf(v);
                v.point += 5000;
                v.interest = min(v.interest+3,60);
                addVictimEvent(idx,'promotion','무료 포인트 프로모션에 노출됐다. 실제 돈을 쓰지 않아도 첫 베팅을 시작하기 쉬워졌다.',1);
                affected++;
            }
            siteEffect='참여 가능한 이용자 '+affected+'명 증가';
            victimEffect='무료 포인트로 첫 베팅 진입 장벽이 낮아짐';
        }
        else if(key === 'charge'){
            title='충전 보너스 강화';
            strategyState.chargeBoostUntil=season+2;
            for(var j=0;j<victimList.length;j++){
                var cv=victimList[j];
                if(cv.betCount>0 || cv.interest>=15){
                    addVictimEvent(j,'promotion','충전 보너스 홍보에 노출됐다. 실제 돈을 넣는 선택이 더 매력적으로 보이기 시작했다.',2);
                    affected++;
                }
            }
            siteEffect='2회차 동안 충전 시도 가능성 상승';
            victimEffect='게임 포인트와 실제 돈의 경계가 흐려질 위험 증가';
        }
        else if(key === 'invite'){
            title='친구추천 보상 강화';
            strategyState.inviteBoostUntil=season+2;
            for(var k=0;k<victimList.length;k++){
                var iv=victimList[k];
                if(iv.friends>0 && (iv.betCount>0 || iv.interest>=15)){
                    addVictimEvent(k,'promotion','친구추천 보상 안내를 받았다. 자신의 참여가 주변 사람에게 퍼질 가능성이 커졌다.',2);
                    affected++;
                }
            }
            siteEffect='2회차 동안 친구추천 발생 가능성 상승';
            victimEffect='한 사람의 도박 참여가 주변 사람에게 확산될 위험 증가';
        }
        else if(key === 'stop'){
            title='보상·유도 중단';
            strategyState.chargeBoostUntil=-1;
            strategyState.inviteBoostUntil=-1;
            for(var m=0;m<victimList.length;m++){
                var sv=victimList[m];
                sv.payattitude=max(5,sv.payattitude-3);
                sv.interest=max(5,sv.interest-2);
                if(sv.betCount>0) addVictimEvent(m,'protect','추가 보상과 유도 메시지가 중단됐다.',0);
                affected++;
            }
            siteEffect='추가 유입·충전 증가 효과 없음';
            victimEffect='추가 충전·확산을 자극하는 요인이 감소';
        }

        strategyState.lastChoiceSeason=season;
        recordOperatorDecision(key,title,siteEffect,victimEffect);
        if(ui_strategyFeedback) ui_strategyFeedback.setText(title+'  |  사이트 효과: '+siteEffect+'  ↔  피해 효과: '+victimEffect);
        if(ui_headline) ui_headline.setText('선택 결과를 관찰하세요: '+title);
        closeStrategyChoice();
    }

    function refreshStrategyButtons(){
        var panelOpen = !!strategyState.pendingChoice && gameOn && !is_dialog;
        if(!panelOpen){
            setStrategyPanelVisible(false);
            return;
        }
        setStrategyPanelVisible(true);
        for(var i=0;i<ui_strategyButtons.length;i++){
            var b=ui_strategyButtons[i];
            var unlocked=strategyUnlocked(b.key);
            if(b.bg && b.bg.input) b.bg.input.enabled=unlocked;
            if(b.text) b.text.setAlpha(unlocked ? 1.0 : 0.22);
            if(b.bg) b.bg.setAlpha(unlocked ? 1.0 : 0.25);
        }
    }

    function addThought(who, what, force){
        var v = victimList[who];
        if(!v) return;
        initializeVictim(v, false);

        // 같은 문장이 연속해서 쌓이지 않도록 한다.
        if(!force && v.lastThoughtText === what && season - v.lastThoughtSeason < 3) return;

        v.thoughts.push({text:what, season:season});
        v.think = what;
        v.lastThoughtSeason = season;
        v.lastEventSeason = season;
        v.lastThoughtText = what;
        v.thoughtCooldown = 2;
        if(typeof ui_headline !== 'undefined' && ui_headline && gameOn){
            ui_headline.setText(v.name + ' : ' + what);
        }
    }

    function updateVictimState(v){
        var riskScore = getVictimRiskScore(v);
        var debtBurden = v.income > 0 ? v.loan / v.income : v.loan;
        if(riskScore >= 80 || v.mental <= 15 || (v.loan >= 5000000 && v.money <= 0) || (debtBurden >= 20 && v.loseCount >= 3)){
            v.state = VictimState.COLLAPSED;
        }
        else if(riskScore >= 55 || v.loan > 0 || v.mental <= 40 || v.lossStreak >= 3){
            v.state = VictimState.DESPERATE;
        }
        else if(v.betCount >= 2 || v.winCount >= 2 || v.interest >= 25){
            v.state = VictimState.ADDICT;
        }
        else if(v.winCount > 0){
            v.state = VictimState.WINNER;
        }
        else{
            v.state = VictimState.CURIOUS;
        }
    }

    function refreshVictimFace(){
        for(let i = 0; i < victimList.length; i++){
            var v = victimList[i];
            updateVictimState(v);
            if(v.state === VictimState.COLLAPSED) v.face = '😭';
            else if(v.state === VictimState.DESPERATE) v.face = '😢';
            else if(gamblePhase == 4 && v.betwho >= 0) v.face = (v.betwho == winner) ? '😋' : '😥';
            else if(v.state === VictimState.ADDICT) v.face = '😐';
            else if(v.state === VictimState.WINNER) v.face = '😄';
            else v.face = '😕';
        }
    }

    // 실제 행동을 우선하고, 그 다음에 성향을 반영한다.
    // 즉 '조건에 맞는 문장 랜덤 선택'이 아니라 '방금 무슨 일이 있었는가'를 먼저 생각한다.
    function refreshVictimThink(){
        for(let i = 0; i < victimList.length; i++){
            var v = victimList[i];
            initializeVictim(v, false);
            updateVictimState(v);

            if(v.thoughtCooldown > 0){
                v.thoughtCooldown--;
                continue;
            }

            var text = null;
            var r = Math.random() * 100;

            // 1. 손실 직후: 손실 회복 욕구가 강한 사람일수록 추격 생각이 빨리 나온다.
            if(v.lossStreak >= 2 || (v.loseCount > 0 && v.totalLost > v.totalWon)){
                if(v.recovery >= 15 || v.state >= VictimState.DESPERATE){
                    text = r < 60 ? '잃은 돈만 찾으면 그만둘 수 있어.' : '한판만 더 따면 복구할 수 있을 것 같아.';
                }
                else if(v.caution >= 15){
                    text = '오늘은 여기서 그만해야겠다.';
                }
                else{
                    text = '아직 손해를 못 메꿨네...';
                }
            }
            // 2. 대출이 있으면 다른 생각보다 빚과 복구가 우선이다.
            else if(v.loan > 0){
                if(v.money <= 0 && v.point <= 0) text = '돈을 어디서 빌려올까...';
                else if(v.recovery >= 12) text = '빌린 돈으로 따서 갚으면 되지 않을까?';
                else text = '빌린 돈까지 잃으면 안 되는데...';
            }
            // 3. 첫 충전 직전/직후
            else if(v.paycount === 0 && mySite.phase >= 2 && v.interest >= 15){
                text = v.caution >= 15 ? '돈까지 넣는 건 좀 망설여지는데...' : '첫충전을 해볼까?';
            }
            // 4. 충전을 반복하면 '더 넣어도 되는 이유'를 찾는다.
            else if(v.paycount >= 2 && v.buymoneytotal > v.income){
                text = v.impulse >= 14 ? '이번에 조금만 더 넣으면 딸 수 있을 것 같아.' : '내가 너무 많이 넣고 있는 건 아닐까?';
            }
            // 5. 첫 승리 직후
            else if(v.winCount === 1 && v.betCount === 1){
                text = v.impulse >= 14 ? '생각보다 잘 되는데? 한 번 더 해볼까?' : '운이 좋았던 걸까?';
            }
            // 6. 연승: 자신감과 베팅 확대
            else if(v.winStreak >= 2){
                text = v.impulse >= 14 ? '오늘은 계속 이길 것 같아.' : '이번에도 운이 좋으면 좋겠다.';
            }
            // 7. 친구 추천은 사회형 성향에 맞게
            else if(mySite.phase >= 3 && v.friends > 0 && v.interest >= 18){
                text = v.social >= 14 ? '친구한테도 한번 알려볼까?' : '친구까지 끌어들이는 건 좀 그런데...';
            }
            // 8. 환전 가능 상태
            else if(v.earn > 20000 && v.point > 0){
                text = v.caution >= 14 ? '이쯤에서 돈으로 바꿔야겠다.' : '조금 더 따고 환전할까?';
            }
            // 9. 아무 사건도 없을 때 현재 단계에 맞는 생각

            else if(v.state === VictimState.DESPERATE){

            }
            else if(v.state === VictimState.ADDICT){
                text = v.impulse >= 14 ? '한판만 더 해볼까?' : '계속하고 있는 게 맞나...';
            }
            else if(v.state === VictimState.WINNER){
                text = '생각보다 돈이 되는데...';
            }
            else if(mySite.phase === 0){
                text = v.caution >= 15 ? '이건 좀 조심해야겠다.' : '이거 재미있을까?';
            }
            else if(mySite.phase >= 1 && v.point > 0){
                text = '한번 해볼까?';
            }

            if(text) v.think = text;
        }
        refreshVictimFace();
    }

    function considerBetting(){

                b = min (b, victimList[i].point);

    function Bet(who, amount, target){
        victimList[who].betwho = target;
        victimList[who].bet = amount;
        victimList[who].betCount++;
        victimList[who].totalWagered = (victimList[who].totalWagered || 0) + amount;
        if(victimList[who].betCount === 1) addVictimEvent(who, 'bet', '처음으로 실제 베팅에 참여했다.', 1);
        victimList[who].point -= amount;
        victimList[who].earn -= amount;
        turtleOnLane[target].bet += amount;
        totalBet += amount;

        ui_headline.setText(victimList[who].name + '님이 ' + amount + '원을 베팅했습니다.');

        //흥미도 상승
        for(let i = 0 ; i < victimList.length ; i++){
            if(victimList[i].interest < 30)
                victimList[i].interest++;
        }
        
    }
    function BetResult(winner){
        for(let i = 0; i < victimList.length ; i++){
            var v = victimList[i];
            if(v.betwho == winner){
                var won = Math.floor(v.bet * turtleOnLane[winner].multiplier);
                v.point += won;
                v.earn += won;
                v.totalWon += won;
                v.totalPayout = (v.totalPayout || 0) + won;
                v.winCount++;
                v.winStreak++;
                v.lossStreak = 0;
                v.firstWin = true;
                addThought(i, v.winCount === 1 ? '처음으로 이겼어. 생각보다 돈이 되는데?' : '또 이겼어. 오늘은 계속 이길 것 같아.');
                if(v.winCount === 1) addVictimEvent(i, 'win', '첫 승리를 경험했다. 승리 뒤 관심도와 베팅 성향이 높아졌다.', 1);
                v.interest = min(v.interest + 2, 60);
                v.risky = min(v.risky + 1, 80);
                v.payattitude = min(v.payattitude + 4, 80);
                v.mental = min(v.mental + 24, 100);
            }
            else if(v.betwho != -1){
                v.loseCount++;
                v.lossStreak++;
                v.winStreak = 0;
                v.totalLost += v.bet;
                // Bet()에서 이미 베팅액을 earn에서 차감했으므로 패배 시 중복 차감하지 않는다.
                v.mental = max(v.mental - (v.lossStreak >= 3 ? 12 : 8), 0);
                v.firstLoss = true;
                addThought(i, v.lossStreak >= 2 ? '또 졌어... 잃은 돈을 찾아야 해.' : '졌다... 다음에는 딸 수 있겠지?');
                if(v.loseCount === 1) addVictimEvent(i, 'loss', '첫 손실을 경험했다.', 1);
                if(v.lossStreak === 2) addVictimEvent(i, 'chase', '연속 손실 뒤 만회하려는 추격 베팅 신호가 나타났다.', 2);
            }
        }
    }

    function considerBuy(){
        for(let i = 0; i < victimList.length ; i++){
            if(victimList[i].money == 0) continue;

            var effectivePayAttitude = victimList[i].payattitude + (strategyState.chargeBoostUntil >= season ? 8 : 0);
            if(victimList[i].paycount == 0 && Math.random() < effectivePayAttitude * (victimList[i].interest-10) / 250000 ){
                buyPoint(i, min(victimList[i].money, Math.floor(Math.floor((Math.random() + Math.random())/2 * victimList[i].risky / 10 * victimList[i].money)/100)*100));
            }
            else if(victimList[i].paycount > 0 && Math.random() < effectivePayAttitude * (victimList[i].interest-10) / 250000 ){
                buyPoint(i, min(victimList[i].money, Math.floor(Math.floor((Math.random() + Math.random())/2 * victimList[i].risky / 5 * victimList[i].money)/100)*100));
            }
        }
    }
    function considerLoan(){
        for(let i = 0; i < victimList.length ; i++){
            var v = victimList[i];
            if(v.interest <= 15 || v.payattitude <= 10) continue;

            var needsMoney = v.money < 1000 && v.point <= 0;
            var chasingLoss = v.lossStreak >= 2 && v.money < Math.max(1000, v.income * 0.3);
            if(!needsMoney && !chasingLoss) continue;

            var probability = (v.payattitude * (v.interest - 10)) / 50000;
            probability += v.recovery / 50000;
            probability += v.impulse / 100000;

            if(Math.random() < probability){
                var base = Math.max(10000, Math.floor((v.risky * 0.6 + v.recovery * 0.4) * 1000));
                var amount = Math.min(base, 5000000);
                loan(i, amount);
                if(v.loan > amount) addThought(i, '빌린 돈까지 다시 넣어볼까...');
            }
        }
    }

    function considerRefund(){
        for(let i = 0; i < victimList.length ; i++){

                refundRequest(i,victimList[i].point);
            }
        }
    }
    function buyPoint(who, amount){
        if(amount <= 0) return;
        var v = victimList[who];
        var isFirstCharge = (v.paycount === 0);

        mySite.money += amount;
        v.money -= amount;
        v.point += amount;
        v.buymoneytotal += amount;
        v.paycount++;

        if(strategyState.chargeBoostUntil >= season) v.point += Math.floor(amount*0.2);
        ui_headline.setText(v.name + '님이 실제 돈 ' + amount.toLocaleString() + '원을 충전했습니다.');
        if(isFirstCharge){
            v.firstCharge = true;
            addThought(who, '처음으로 내 돈을 넣었어.', true);
            addVictimEvent(who, 'charge', '무료 포인트 이후 처음으로 실제 돈을 충전했다.', 2);
        } else if(v.paycount === 2){
            addThought(who, '한 번으로 끝내려 했는데 다시 충전하고 있어.', true);
            addVictimEvent(who, 'charge', '두 번째 실제 돈 충전이 발생했다.', 2);
        } else {
            addThought(who, '이번에도 돈을 넣었어.');
        }
    }

            for(let i=0;i<victimList.length;i++){
                var v=victimList[i];
                if(v.betCount>0 || v.buymoneytotal>0 || v.loan>0) victimCount++;
                if(v.buymoneytotal>0) victimMoney+=v.buymoneytotal;
                if(v.loan>0) victimLoanCount++;
                totalBets += v.betCount || 0;
                totalLoss += v.totalLost || 0;
                totalNetLoss += getNetBetLoss(v);
            }

            // 고정 제목
            this.add.rectangle(540,80,1080,160,0x000000,0.90).setDepth(20);
            this.add.text(540,45,'피해자의 기록',{
                fontSize:'64px',color:'#ffffff',fontStyle:'bold',
                align:'center',fixedWidth:1000
            }).setOrigin(0.5).setDepth(21);
            this.add.text(540,115,'게임 속 선택이 피해자의 삶에 남긴 기록입니다.',{
                fontSize:'32px',color:'#dddddd',align:'center',fixedWidth:1000
            }).setOrigin(0.5).setDepth(21);

            // ★ 핵심: 스크롤되는 것은 reportContainer 하나뿐이다.
            // 검은 하단 영역은 container 밖에 만들어 절대로 같이 움직이지 않는다.
            reportMaskShape=this.make.graphics();
            reportMaskShape.fillStyle(0xffffff,1);
            reportMaskShape.fillRect(0,190,1080,770);
            var reportMask=reportMaskShape.createGeometryMask();

            reportContainer=this.add.container(0,0).setDepth(5);
            reportContainer.setMask(reportMask);

            var y=220;

            if(mySite.decisions && mySite.decisions.length>0){
                var decisionLines=['게임 중 선택한 운영 전략'];
                for(var di=0; di<mySite.decisions.length; di++){
                    var d=mySite.decisions[di];
                    decisionLines.push(d.season+'회차 · '+d.title+'\n  사이트: '+d.siteEffect+'\n  피해: '+d.victimEffect);
                }
                var decisionText=this.add.text(130,y+28,decisionLines.join('\n\n'),{
                    fontSize:'29px',color:'#ffe6a7',wordWrap:{width:790},lineSpacing:7
                });
                var decisionHeight=decisionText.height+70;
                reportContainer.add(this.add.rectangle(540,y+decisionHeight/2,900,decisionHeight,0x19150c,0.96));
                reportContainer.add(decisionText);
                y+=decisionHeight+35;
            }

            reportContainer.add(this.add.rectangle(540,y+75,900,150,0x111111,0.94));
            reportContainer.add(this.add.text(540,y+75,
                '피해자 '+victimCount+'명     총 충전 '+victimMoney.toLocaleString()+'원\n'+
                '패배한 베팅액 합계 '+totalLoss.toLocaleString()+'원     순베팅손실 '+totalNetLoss.toLocaleString()+'원\n'+
                '대출 발생 '+victimLoanCount+'명     총 베팅 '+totalBets+'회',{
                    fontSize:'38px',color:'#ffffff',align:'center',
                    fixedWidth:850,lineSpacing:12
                }).setOrigin(0.5));
            y+=190;

            for(let i=0;i<victimList.length;i++){
                var v=victimList[i];
                if(!(v.betCount>0 || v.buymoneytotal>0 || v.loan>0 || (v.thoughts && v.thoughts.length>0))) continue;

                var diary = (v.events && v.events.length>0)
                    ? v.events
                    : ((v.thoughts && v.thoughts.length>0) ? v.thoughts : [{season:'', text:(v.think || '기록 없음')}]);

                // 텍스트를 먼저 만든 뒤 실제 높이를 합산해서 카드 크기를 정한다.
                var cardItems=[];
                var title=this.add.text(110,0,
                    (v.face||'●')+'  '+v.name+(v.personality?' · '+v.personality:''),
                    {fontSize:'42px',color:'#ffffff',fontStyle:'bold',fixedWidth:820}
                );
                cardItems.push({obj:title, offset:28});

                var localY=90;
                for(let j=0;j<diary.length;j++){
                    var thought=diary[j];
                    var thoughtSeason=(typeof thought==='object'&&thought!==null)
                        ? (thought.season ?? thought.day ?? '') : '';
                    var text=(typeof thought==='object'&&thought!==null)
                        ? (thought.text||'') : String(thought);
                    // 혹시 데이터 안에 문자 그대로 "\\n"이 남아 있어도 표시 전에 실제 개행으로 정규화한다.
                    text=String(text).replace(/\\n/g,'\n');

                    var eventType=(typeof thought==='object'&&thought!==null) ? (thought.type||'') : '';
                    var prefix={join:'[유입] ',bet:'[베팅] ',win:'[승리] ',loss:'[손실] ',chase:'[추격] ',charge:'[충전] ',loan:'[대출] ',invite:'[확산] ',risk:'[위험] ',mental:'[심리] ',repeat:'[반복] ',debt:'[대출] ',refund:'[환전] ',promotion:'[유도] ',protect:'[중단] '}[eventType] || '';
                    var sev=(typeof thought==='object'&&thought!==null) ? (thought.severity||0) : 0;
                    var lineColor = sev>=3 ? '#ffb3b3' : (sev===2 ? '#ffe0a3' : '#eeeeee');
                    var line=this.add.text(130,0,
                        thoughtSeason !== '' ? thoughtSeason+'회차  '+prefix+text : prefix+text,
                        {fontSize:'32px',color:lineColor,wordWrap:{width:790},lineSpacing:7}
                    );
                    cardItems.push({obj:line, offset:localY});
                    localY += line.height + 20;
                }

                var summary=this.add.text(130,0,
                    '위험 '+getRiskLabel(getVictimRiskScore(v))+' '+getVictimRiskScore(v)+'/100   패배베팅 '+(v.totalLost||0).toLocaleString()+'원   순베팅손실 '+getNetBetLoss(v).toLocaleString()+'원\n대출 '+(v.loan||0).toLocaleString()+'원   충전 '+(v.buymoneytotal||0).toLocaleString()+'원   총 베팅 '+(v.betCount||0)+'회',
                    {fontSize:'28px',color:'#bbbbbb',wordWrap:{width:790},lineSpacing:6}
                );
                cardItems.push({obj:summary, offset:localY+5});
                localY += summary.height + 35;

                var cardHeight=Math.max(180,localY+20);
                var card=this.add.rectangle(540,y+cardHeight/2,900,cardHeight,0x111111,0.94);
                reportContainer.add(card);

                for(let k=0;k<cardItems.length;k++){
                    cardItems[k].obj.y=y+cardItems[k].offset;
                    reportContainer.add(cardItems[k].obj);
                }
                y+=cardHeight+35;
            }

            reportContainer.add(this.add.text(540,y+70,'— 피해자의 기록 끝 —',{
                fontSize:'36px',color:'#ffffff',align:'center',fixedWidth:900
            }).setOrigin(0.5));
            y+=180;
            this.reportContentBottom=y;

            // ★ 고정 하단 교육 영역: reportContainer와 완전히 별개
            this.add.rectangle(540,1440,1080,960,0x050505,0.97).setDepth(30);
            this.add.rectangle(540,970,1080,20,0x000000,1).setDepth(31);

            this.add.text(540,1045,'이 게임에서 당신이 만든 결과',{
                fontSize:'46px',color:'#ffffff',fontStyle:'bold',
                align:'center',fixedWidth:1000
            }).setOrigin(0.5).setDepth(32);

            this.add.text(540,1140,
                '운영 수익보다 중요한 것은\n그 과정에서 피해자가 어떻게 변했는가입니다.',{
                    fontSize:'32px',color:'#dddddd',align:'center',
                    fixedWidth:920,lineSpacing:18
                }).setOrigin(0.5).setDepth(32);

            this.add.text(540,1320,
                '피해자  '+victimCount+'명\n'+
                '패배한 베팅액 합계  '+totalLoss.toLocaleString()+'원\n'+
                '순베팅손실  '+totalNetLoss.toLocaleString()+'원\n'+
                '실제 충전  '+victimMoney.toLocaleString()+'원\n'+
                '대출 발생  '+victimLoanCount+'명',{
                    fontSize:'38px',color:'#ffffff',align:'center',
                    fixedWidth:900,lineSpacing:12
                }).setOrigin(0.5).setDepth(32);

            this.add.text(540,1535,
                '사이버도박은 게임이 끝나면 사라지는 선택이 아닙니다.\n'+
                '피해자의 돈과 인간관계, 일상에 흔적을 남깁니다.',{
                    fontSize:'30px',color:'#dddddd',align:'center',
                    fixedWidth:920,lineSpacing:14
                }).setOrigin(0.5).setDepth(32);

            this.add.text(540,1680,'생각해 보기: 처음에는 무엇이 참여를 쉽게 만들었고, 어느 순간부터 멈추기 어려워졌을까요?',{
                fontSize:'29px',color:'#ffe6a7',align:'center',fixedWidth:960,wordWrap:{width:960},lineSpacing:7
            }).setOrigin(0.5).setDepth(32);

            this.add.text(540,1760,'▲ 위쪽의 피해자 기록을 끝까지 확인하세요 ▲',{
                fontSize:'30px',color:'#aaaaaa',align:'center',fixedWidth:1000
            }).setOrigin(0.5).setDepth(32);

            this.add.text(540,1840,'SPACE : 빠르게 보기 / 마우스·터치 : 직접 스크롤',{
                fontSize:'28px',color:'#888888',align:'center',fixedWidth:1000
            }).setOrigin(0.5).setDepth(32);

            this.input.keyboard.on('keydown-SPACE',()=>{reportScrollSpeed=7;});
            this.input.keyboard.on('keyup-SPACE',()=>{reportScrollSpeed=1.2;});

            this.input.on('wheel',(pointer,gameObjects,deltaX,deltaY)=>{
                reportContainer.y-=deltaY*0.35;
                this.clampReportScroll();
            },this);

            this.input.on('pointerdown',pointer=>{
                this.dragStartY=pointer.y;
                this.dragStartReportY=reportContainer.y;
            });

            this.input.on('pointermove',pointer=>{
                if(pointer.isDown && this.dragStartY!==undefined){
                    reportContainer.y=this.dragStartReportY+(pointer.y-this.dragStartY);
                    this.clampReportScroll();
                }
            });

            this.input.on('pointerup',()=>{
                this.dragStartY=undefined;
                this.dragStartReportY=undefined;
            });
        }

        clampReportScroll(){
            var minY=940-this.reportContentBottom;
            if(reportContainer.y>190) reportContainer.y=190;
            if(reportContainer.y<minY){
                reportContainer.y=minY;
                reportFinished=true;
            }
        }

        update(){
            if(!reportFinished){
                reportContainer.y-=reportScrollSpeed;
                var minY=940-this.reportContentBottom;
                if(reportContainer.y<=minY){
                    reportContainer.y=minY;
                    reportFinished=true;
                }
            }
        }
    }


    var config = {
        type: Phaser.AUTO,
        width: 1080,
        height: 1920,

        scale:{
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
            default: 'arcade'
        },
        scene: [Scene1,Scene2,Scene3],
        parent : "gamewindow"
    };

    var game = new Phaser.Game(config);


    </script>
    <div id="gamewindow"></div>

</body>
</html>
