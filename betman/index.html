    function valueRotate(min,max,add,now){
        if(now + add < min) return max;
        if(now + add > max) return min;
        return now + add;
    }
    function valueInRange(min,max,add,now){
        if(now + add > max) return max;
        if(now + add < min) return min;
        return now + add;
    }
    function isInRange(min,max,now){
        if(now >= min && now <= max) return true;
        return false;
    }
    function max(a,b){
        if(a>= b) return a;
        else return b;
    }
    function min(a,b){
        if(a>= b) return b;
        else return a;
    }

    function addThought(who, what){
        victimList[who].thoughts.push({text:what,season:season});

    function refreshVictimFace(){
        for(let i = 0; i < victimList.length; i++){
            var v = victimList[i];
            if(v.earn == 0 && v.bet == 0){
                v.face = '😕'; //처음옴
                v.state = 0;
            }
            else if(gamblePhase == 2){
                if(v.point == 0 && v.bet > 0){ //올인
                    v.face = '😣';
                }
                else if(v.point > 0 && v.bet == 0){ //관망
                    v.face = '🤔';
                }
            }
            else if(gamblePhase == 4 && v.betwho >= 0){
                if(v.point == 0 && v.bet > 0){ //올인
                    if(v.face != '😣')addThought(i, '포인트를 전부 걸었어');
                    v.face = '😣';
                    
                }
                if(v.betwho == winner){//승리
                    v.face = '😋';
                }
                else{//패배
                    v.face = '😥';
                }
            }
            else if(v.point + v.bet == 0){ //다잃음
                if(v.face != '😭')addThought(i, '포인트를 전부 잃었어');
                v.face = '😭';
            }
            else if(v.earn + v.bet < 0){ //손해
                v.face = '🙁';
            }
            else if(v.earn + v.bet > 0){ //이익
                v.face = '😊';
            }
            
        }
    }
    function refreshVictimThink(){
        for(let i = 0; i < victimList.length; i++){
            var candidates = thinking.filter(function(t){
                if(t.phase !== undefined && mySite.phase < t.phase) return false;
                if(t.state !== undefined && victimList[i].state !== t.state) return false;
                if(t.mental !== undefined && victimList[i].mental > t.mental) return false;
                return true;
            });
            if(candidates.length > 0){
                var picked = candidates[Math.floor(Math.random() * candidates.length)];
                victimList[i].think = picked.text;
            }
        }
    }
    function refreshUiVictim(){

                        ui_victim[i*2+1].setText( victim.face + victim.name +' '+Math.floor(victim.point)+ ' (' + Math.floor(victim.earn) +') '+ (victim.betwho>=0? (victim.betwho+1) + '번에 베팅 ' + victim.bet : ''));
                    }
                    else{

                }
                break;

    function considerBetting(){
        for(let i = 0; i < victimList.length ; i++){
            var a = (Math.random()*8000 < victimList[i].interest);
            if(a == true && victimList[i].betwho == -1){
                var b = Math.floor(Math.floor(Math.random() * victimList[i].risky / 10 * victimList[i].point + 1)/100)*100;
                b = min (b, victimList[i].point);
                if(b>0){
                    Bet(i,b,Math.floor(Math.random()*4));
                }
            }
        }
    }
    function Bet(who, amount, target){
        victimList[who].betwho = target;
        victimList[who].bet = amount;
        victimList[who].point -= amount;
        victimList[who].earn -= amount;
        turtleOnLane[target].bet += amount;
        totalBet += amount;

        ui_headline.setText(victimList[who].name + '님이 ' + amount + '원을 베팅했습니다.');

        //흥미도 상승
        for(let i = 0 ; i < victimList.length ; i++){
            if(victimList[i].interest < 30)
                victimList[i].interest++;
        }
        
    }
    function BetResult(winner){
        for(let i = 0; i < victimList.length ; i++){
            if(victimList[i].betwho == winner){
                victimList[i].point += Math.floor(victimList[i].bet * turtleOnLane[winner].multiplier);
                victimList[i].earn += Math.floor(victimList[i].bet * turtleOnLane[winner].multiplier);

                addThought(i, '이겼다! '+victimList[i].bet*3+'원을 벌었어');
                victimList[i].interest += 2;
                victimList[i].risky += 1;
                victimList[i].payattitude += 4;
                victimList[i].mental += 24;
            }
            else if(victimList[i].betwho != -1){
                addThought(i, '졌다! '+victimList[i].bet+'원을 잃었어');
                victimList[i].mental -= 8;
            }
        }
    }

    function considerBuy(){
        for(let i = 0; i < victimList.length ; i++){
            if(victimList[i].money == 0) continue;

            if(victimList[i].paycount == 0 && Math.random() < victimList[i].payattitude * (victimList[i].interest-10) / 250000 ){
                buyPoint(i, min(victimList[i].money, Math.floor(Math.floor((Math.random() + Math.random())/2 * victimList[i].risky / 10 * victimList[i].money)/100)*100));
                addThought(i, '처음으로 충전했어');
                victimList[i].paycount++;//todo
            }
            else if(victimList[i].paycount > 0 && Math.random() < victimList[i].payattitude * (victimList[i].interest-10) / 250000 ){
                buyPoint(i, min(victimList[i].money, Math.floor(Math.floor((Math.random() + Math.random())/2 * victimList[i].risky / 5 * victimList[i].money)/100)*100));
            }
        }
    }
    function considerLoan(){
        for(let i = 0; i < victimList.length ; i++){
            if(victimList[i].money < 1000 && Math.random() < victimList[i].payattitude * (victimList[i].interest-15) / 300000 ){
                if(victimList[i].loan == 0)addThought(i, '처음으로 대출했어');
                loan(i, Math.floor((Math.random() + Math.random())/2 * victimList[i].risky * 100)*100);
            }
            else if(victimList[i].money == 0 && victimList[i].point == 0 && Math.random() < victimList[i].payattitude * (victimList[i].interest-15) / 30000 ){
                if(victimList[i].loan == 0)addThought(i, '처음으로 대출했어');
                loan(i, Math.floor((Math.random() + Math.random())/2 * victimList[i].risky * 100)*100);
            }
                
        }
    }
    function considerRefund(){
        for(let i = 0; i < victimList.length ; i++){
            if(victimList[i].earn > 20000){

    }
    function buyPoint(who, amount){
        mySite.money += amount;
        victimList[who].money -= amount;
        victimList[who].point += amount;

        victimList[who].buymoneytotal += amount;
        
        if(mySite.phase >= 2) victimList[who].point += Math.floor(amount*0.2);
        ui_headline.setText(victimList[who].name + '님이 ' + amount + '원을 충전했습니다.');
        addThought(who, amount+'원만큼 충전했어');
    }
    function refundPoint(who, amount){
        mySite.money -= amount;
        victimList[who].money += amount;
        victimList[who].point -= amount;
    }
    function refundRequest(who, amount){

    function loan(who, amount){
        victimList[who].money += amount;
        victimList[who].loan += amount;
        victimList[who].risky += Math.floor(amount/10000);
        addThought(who, amount+'원만큼 돈을 빌렸어');

    function invite(who){
        victimList[who].point += 10000;
